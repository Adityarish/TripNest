<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1d2724" />
    <title>You’re offline · TripNest</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#f7f2e8;color:#1d2724;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(100%,440px);padding:34px;border:1px solid rgba(29,39,36,.09);border-radius:32px;background:#fff;box-shadow:0 24px 70px rgba(29,39,36,.09);text-align:center}.icon{width:72px;height:72px;border-radius:20px;box-shadow:0 8px 22px rgba(29,39,36,.15)}h1{margin:22px 0 10px;font:normal 42px/1 Georgia,"Times New Roman",serif;letter-spacing:-.035em}p{margin:0;color:rgba(29,39,36,.62);font-size:14px;line-height:1.7}button{margin-top:26px;border:0;border-radius:999px;padding:13px 22px;background:#e66b4d;color:#fff;font:600 14px/1 system-ui;cursor:pointer}button:focus-visible{outline:3px solid rgba(230,107,77,.35);outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icon-192.png" width="72" height="72" alt="TripNest" />
      <h1>You’re offline.</h1>
      <p>TripNest needs a connection to securely load your journeys and private files. Your account data has not been stored on this device for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
